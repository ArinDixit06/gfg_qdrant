services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: edge-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST + snapshot API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    environment:
      # Enable per-collection sharding & snapshot APIs (defaults are fine).
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots

  postgres:
    image: postgres:16-alpine
    container_name: edge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgepass}
      POSTGRES_DB: ${POSTGRES_DB:-edgememory}
    volumes:
      - pg_storage:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  qdrant_storage:
  qdrant_snapshots:
  pg_storage:
