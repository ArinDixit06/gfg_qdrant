[project]
name = "edge-memory-agent"
version = "0.1.0"
description = "Offline-first edge memory agent on Qdrant Edge with cloud sync"
requires-python = ">=3.10"
dependencies = [
    "qdrant-edge-py>=0.1.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "psycopg[binary]>=3.2.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
